# Template for the PRIVATE runner repository.
# Copy this file to `.github/workflows/daily.yml` in a private repo.
# It installs library-tracker from the public repo, keeps the SQLite
# database as a private artifact and never commits personal data.

name: Daily library run

on:
  schedule:
    - cron: "0 5 * * *"  # 06:00 Berlin (winter time)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install library-tracker from the public repository
        run: python -m pip install "git+https://github.com/PaulJMeyer/library_tracker@master"

      - name: Install Chromium for READO
        run: python -m playwright install --with-deps chromium

      - name: Restore previous SQLite database
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p data
          # Newest non-expired database artifact, also from failed runs, so
          # catalog search progress is kept even when one step failed.
          RUN_ID=$(gh api "repos/$GH_REPO/actions/artifacts?name=library-tracker-db&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')

          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name library-tracker-db --dir data
          else
            echo "No previous database artifact found, starting with an empty database."
          fi

      # Full pipeline: READO lists -> metadata -> catalog search (a few new
      # ISBNs per book and run) -> add found books to the Merkliste ->
      # Telegram overview. Failing steps are reported as a warning in
      # Telegram; the job then fails, but the database is still uploaded.
      - name: Sync and send Telegram overview
        env:
          LIBRARY_USERNAME: ${{ secrets.LIBRARY_USERNAME }}
          LIBRARY_PASSWORD: ${{ secrets.LIBRARY_PASSWORD }}
          READO_WISHLIST_URL: ${{ secrets.READO_WISHLIST_URL }}
          READO_TBR_URL: ${{ secrets.READO_TBR_URL }}
          READO_READING_URL: ${{ secrets.READO_READING_URL }}
          READO_COMPLETED_URL: ${{ secrets.READO_COMPLETED_URL }}
          OPENLIBRARY_CONTACT_EMAIL: ${{ secrets.OPENLIBRARY_CONTACT_EMAIL }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: library-tracker sync --telegram

      - name: Upload SQLite database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-tracker-db
          path: data/library_tracker.db
          retention-days: 90
          if-no-files-found: error

      - name: Upload results overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.md
          retention-days: 14
          if-no-files-found: ignore
