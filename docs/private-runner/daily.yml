# Template for the PRIVATE runner repository.
# Copy this file to `.github/workflows/daily.yml` in a private repo.
# It installs library-tracker from the public repo, keeps the SQLite
# database as a private artifact and never commits personal data.

name: Daily library run

on:
  schedule:
    - cron: "0 5 * * *"  # 06:00 Berlin (winter time)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install library-tracker from the public repository
        run: python -m pip install "git+https://github.com/PaulJMeyer/library_tracker@master"

      - name: Restore previous SQLite database
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p data
          RUN_ID=$(gh run list \
            --workflow daily.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" \
              --name library-tracker-db \
              --dir data \
              || echo "No previous database artifact found."
          else
            echo "No previous successful workflow run found."
          fi

      - name: Run library scrape and send Telegram overview
        env:
          LIBRARY_USERNAME: ${{ secrets.LIBRARY_USERNAME }}
          LIBRARY_PASSWORD: ${{ secrets.LIBRARY_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: library-tracker scrape --telegram

      - name: Upload SQLite database
        uses: actions/upload-artifact@v4
        with:
          name: library-tracker-db
          path: data/library_tracker.db
          retention-days: 90
          if-no-files-found: error

      - name: Upload results overview
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.md
          retention-days: 14
