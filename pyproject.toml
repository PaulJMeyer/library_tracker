[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-tracker"
version = "0.3.0"
description = "Persönliche Merklisten-Auswertung für die Stadtbibliothek Bremen"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.14.3",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "mypy==1.14.1",
    "types-requests>=2.33.0",
    "types-beautifulsoup4>=4.12.0",
]

[project.scripts]
library-tracker = "library_tracker.main:main"

[tool.setuptools.packages.find]
include = ["library_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["library_tracker"]
